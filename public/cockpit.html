<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Calling Cockpit</title>
<style>
  :root {
    --bg: #f6f6f4; --panel: #ffffff; --ink: #1c1c1a; --muted: #6b6b66; --line: #e4e3df;
    --accent: #1f5f4a; --accent-ink: #ffffff; --accent-soft: #e3efe9;
    --warn: #8a5a00; --warn-soft: #fbf0d9; --bad: #a3271c; --bad-soft: #f9e2df;
    --good: #1f6d3a; --good-soft: #e0f1e5; --radius: 10px;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141413; --panel: #1d1d1b; --ink: #eceae4; --muted: #9b9a93; --line: #2f2e2b;
      --accent: #5fb393; --accent-ink: #0f1a15; --accent-soft: #1f3129;
      --warn: #e2b155; --warn-soft: #34291a; --bad: #ef8a7e; --bad-soft: #3a201d;
      --good: #7fcb97; --good-soft: #1c3023;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  header { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; justify-content: space-between;
    padding: 14px 16px; border-bottom: 1px solid var(--line); background: var(--panel); }
  h1 { font-size: 17px; margin: 0; font-weight: 650; }
  h2 { font-size: 22px; margin: 0 0 2px; font-weight: 650; }
  h3 { font-size: 13px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin: 18px 0 8px; font-weight: 600; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { font-size: 12.5px; padding: 3px 9px; border-radius: 999px; background: var(--bg); border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
  .chip.good { background: var(--good-soft); color: var(--good); border-color: transparent; }
  .chip.warn { background: var(--warn-soft); color: var(--warn); border-color: transparent; }
  .chip.bad { background: var(--bad-soft); color: var(--bad); border-color: transparent; }
  main { display: grid; grid-template-columns: 320px 1fr; gap: 16px; padding: 16px; max-width: 1200px; margin: 0 auto; }
  @media (max-width: 820px) { main { grid-template-columns: 1fr; } }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; min-width: 0; }
  .queue { padding: 8px; }
  .queue-head { display: flex; justify-content: space-between; align-items: center; padding: 6px 8px 10px; }
  .item { display: block; width: 100%; text-align: left; border: 0; background: none; color: inherit; font: inherit;
    padding: 10px; border-radius: 8px; cursor: pointer; }
  .item:hover { background: var(--bg); }
  .item.sel { background: var(--accent-soft); }
  .item .name { font-weight: 600; }
  .item .meta { font-size: 13px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 8px; margin-top: 2px; }
  .empty { color: var(--muted); padding: 24px 8px; text-align: center; }
  .facts { display: grid; grid-template-columns: max-content 1fr; gap: 6px 14px; margin: 12px 0 0; }
  .facts dt { color: var(--muted); }
  .facts dd { margin: 0; overflow-wrap: anywhere; }
  .notes { white-space: pre-wrap; background: var(--bg); border-radius: 8px; padding: 12px; overflow-wrap: anywhere; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 16px; }
  button.btn { font: inherit; font-weight: 600; border-radius: 8px; padding: 9px 16px; cursor: pointer;
    border: 1px solid var(--line); background: var(--panel); color: var(--ink); }
  button.btn:hover:not(:disabled) { border-color: var(--muted); }
  button.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  button.btn.danger { background: var(--bad); color: #fff; border-color: var(--bad); }
  button.btn:disabled { opacity: .45; cursor: not-allowed; }
  button.link { border: 0; background: none; color: var(--muted); font: inherit; font-size: 13px; cursor: pointer; text-decoration: underline; padding: 0; }
  .hint { font-size: 13px; color: var(--muted); }
  .stage { font-size: 26px; font-weight: 650; margin: 4px 0; }
  .legs { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-top: 12px; }
  @media (max-width: 520px) { .legs { grid-template-columns: 1fr; } }
  .leg { border: 1px solid var(--line); border-radius: 8px; padding: 10px; }
  .leg .who { font-size: 12.5px; color: var(--muted); }
  .leg .state { font-weight: 600; }
  ol.log { list-style: none; padding: 0; margin: 0; font-size: 13.5px; }
  ol.log li { padding: 4px 0; border-bottom: 1px dashed var(--line); display: flex; gap: 10px; }
  ol.log time { color: var(--muted); font-variant-numeric: tabular-nums; }
  form.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  @media (max-width: 520px) { form.grid { grid-template-columns: 1fr; } }
  form .full { grid-column: 1 / -1; }
  label { display: grid; gap: 4px; font-size: 13px; color: var(--muted); }
  label.check { display: flex; gap: 8px; align-items: center; color: var(--ink); font-size: 14px; }
  input, select, textarea { font: inherit; color: var(--ink); background: var(--panel); border: 1px solid var(--line);
    border-radius: 8px; padding: 8px 10px; width: 100%; }
  textarea { min-height: 70px; resize: vertical; }
  input[type=checkbox] { width: auto; }
  .gate { max-width: 420px; margin: 12vh auto; padding: 0 16px; }
  .toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); max-width: calc(100% - 32px);
    background: var(--ink); color: var(--panel); padding: 10px 16px; border-radius: 8px; font-size: 14px; z-index: 10; }
  .toast.bad { background: var(--bad); color: #fff; }
  [hidden] { display: none !important; }
</style>
</head>
<body>

<div id="gate" class="gate" hidden>
  <div class="panel">
    <h2>Calling cockpit</h2>
    <p class="hint">Enter your admin API key (ADMIN_API_KEY). It's kept in this browser tab only.</p>
    <form id="gate-form">
      <input id="gate-key" type="password" autocomplete="current-password" placeholder="Admin API key" required>
      <div class="row"><button class="btn primary" type="submit">Open cockpit</button></div>
    </form>
  </div>
</div>

<div id="app" hidden>
  <header>
    <h1>Calling cockpit</h1>
    <div class="chips" id="chips"></div>
  </header>
  <main>
    <section class="panel queue" aria-label="Prospects to call">
      <div class="queue-head">
        <strong>To call today</strong>
        <button class="link" id="refresh">Refresh</button>
      </div>
      <div id="queue"></div>
    </section>
    <section class="panel" id="main" aria-live="polite"></section>
  </main>
</div>

<div id="toast" class="toast" hidden role="status"></div>

<script>
(() => {
  'use strict';
  const KEY = 'cockpit-admin-key';
  let key = null;
  try { key = sessionStorage.getItem(KEY); } catch (_) {}

  const state = { status: null, queue: [], selected: null, session: null, busy: false, poll: null };

  // ── tiny DOM helper: text only, never innerHTML with data ──
  function h(tag, attrs, ...kids) {
    const el = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs || {})) {
      if (v === false || v == null) continue;
      if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
      else if (k === 'class') el.className = v;
      else el.setAttribute(k, v === true ? '' : v);
    }
    for (const kid of kids.flat()) if (kid != null && kid !== false) el.append(kid instanceof Node ? kid : String(kid));
    return el;
  }
  const $ = (id) => document.getElementById(id);

  let toastTimer;
  function toast(msg, bad) {
    const t = $('toast');
    t.textContent = msg; t.className = 'toast' + (bad ? ' bad' : ''); t.hidden = false;
    clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.hidden = true; }, bad ? 6000 : 3000);
  }

  async function api(method, path, body) {
    const res = await fetch('/api/cockpit' + path, {
      method,
      headers: { Authorization: 'Bearer ' + key, ...(body ? { 'Content-Type': 'application/json' } : {}) },
      body: body ? JSON.stringify(body) : undefined,
    });
    if (res.status === 401) { signOut(); throw new Error('That key was not accepted'); }
    if (res.status === 204) return null;
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || ('HTTP ' + res.status));
    return data;
  }

  async function act(fn, okMsg) {
    if (state.busy) return;
    state.busy = true; render();
    try { const r = await fn(); if (okMsg) toast(okMsg); return r; }
    catch (e) { toast(e.message, true); }
    finally { state.busy = false; render(); }
  }

  function signOut() {
    key = null;
    try { sessionStorage.removeItem(KEY); } catch (_) {}
    stopPolling();
    $('app').hidden = true; $('gate').hidden = false;
  }

  // ── data ──
  async function loadStatus() { state.status = await api('GET', '/status'); }
  async function loadQueue() {
    try {
      const { queue } = await api('GET', '/queue');
      state.queue = queue;
      if (state.selected) state.selected = queue.find((p) => p.pubName === state.selected.pubName) || null;
      if (!state.selected) state.selected = queue.find((p) => !p.blocked) || queue[0] || null;
    } catch (e) { state.queue = []; toast(e.message, true); }
  }
  async function loadSession() {
    const { session } = await api('GET', '/session');
    state.session = session;
    if (session && session.stage !== 'ended') startPolling(); else stopPolling();
  }
  function startPolling() {
    if (state.poll) return;
    state.poll = setInterval(async () => {
      try { await loadSession(); render(); } catch (_) {}
    }, 1500);
  }
  function stopPolling() { clearInterval(state.poll); state.poll = null; }

  // ── render ──
  function render() {
    renderChips(); renderQueue(); renderMain();
  }

  function renderChips() {
    const s = state.status; const c = $('chips'); c.replaceChildren();
    if (!s) return;
    c.append(
      h('span', { class: 'chip ' + (s.callingWindowOpen ? 'good' : 'warn'), title: s.callingHours + ' (UK time)' },
        s.callingWindowOpen ? 'Calling hours: open' : 'Outside calling hours'),
      h('span', { class: 'chip ' + (s.sheets ? 'good' : 'bad') }, s.sheets ? 'Sheet connected' : 'Sheet not connected'),
      h('span', { class: 'chip ' + (s.agentPhone ? 'good' : 'bad') }, s.agentPhone ? 'Your phone ' + s.agentPhone : 'AGENT_PHONE_NUMBER not set'),
      h('span', { class: 'chip ' + (s.demoApp ? 'good' : 'warn'), title: s.demoApp ? '' : 'Run scripts/setup-twilio.ts and set TWILIO_DEMO_APP_SID' },
        s.demoApp ? 'Demo app ready' : 'Demo via own number'),
      h('button', { class: 'link', onclick: signOut }, 'Lock'),
    );
  }

  function renderQueue() {
    const q = $('queue'); q.replaceChildren();
    if (!state.status?.sheets) { q.append(h('p', { class: 'empty' }, 'Connect the Google Sheet to see prospects (README → Google Sheets sync).')); return; }
    if (!state.queue.length) { q.append(h('p', { class: 'empty' }, 'Nobody due today. Add pubs to the Prospects tab, then Refresh.')); return; }
    for (const p of state.queue) {
      q.append(h('button', {
        class: 'item' + (state.selected?.pubName === p.pubName ? ' sel' : ''),
        onclick: () => { state.selected = p; render(); },
        'aria-pressed': state.selected?.pubName === p.pubName ? 'true' : 'false',
      },
        h('div', { class: 'name' }, p.pubName),
        h('div', { class: 'meta' },
          p.area && h('span', {}, p.area),
          h('span', {}, p.blocked || p.reason),
          p.demoUpdatedAt ? h('span', { class: 'chip good' }, 'Demo') : null,
        ),
      ));
    }
  }

  function renderMain() {
    const m = $('main');
    const s = state.session;
    const parts = s && s.stage !== 'ended' ? sessionView(s) : s ? outcomeView(s) : prospectView(state.selected);
    m.replaceChildren(...parts.filter((p) => p != null && p !== false));
  }

  function prospectView(p) {
    if (!p) return [h('p', { class: 'empty' }, 'Pick a prospect.')];
    const st = state.status || {};
    const why = p.blocked ? p.blocked
      : !st.callingWindowOpen ? 'Outside calling hours (' + st.callingHours + ')'
      : !st.agentPhone ? 'Set AGENT_PHONE_NUMBER first'
      : null;
    const fact = (k, v) => v ? [h('dt', {}, k), h('dd', {}, v)] : [];
    return [
      h('h2', {}, p.pubName),
      h('div', { class: 'hint' }, [p.area, p.reason].filter(Boolean).join(' · ')),
      h('dl', { class: 'facts' },
        fact('Phone', p.phone), fact('Address', p.address),
        fact('Contact', [p.contactName, p.contactRole].filter(Boolean).join(', ')),
        fact('Best time', p.bestTimeToCall), fact('Booking', p.bookingSystem),
        fact('Times called', p.timesCalled || '0'), fact('Website', p.website),
      ),
      h('h3', {}, 'Research notes'),
      h('div', { class: 'notes' }, p.researchNotes || 'No notes yet.'),
      h('div', { class: 'row' },
        h('button', { class: 'btn primary', disabled: !!why || state.busy, onclick: () => act(async () => {
          state.session = await api('POST', '/call', { pubName: p.pubName }); startPolling();
        }, 'Ringing your phone — answer and press 1') }, 'Call ' + p.pubName),
        h('button', { class: 'btn', disabled: state.busy, onclick: () => act(async () => {
          await api('POST', '/demo', { pubName: p.pubName }); await loadQueue();
        }, 'Demo saved') }, p.demoUpdatedAt ? 'Rebuild demo' : 'Build demo'),
      ),
      why ? h('p', { class: 'hint' }, why) : null,
      !p.demoUpdatedAt ? h('p', { class: 'hint' }, 'Build the demo before calling so you can bring it in. It uses the research notes, address and booking system.') : null,
    ];
  }

  const STAGE = {
    'calling-you': 'Ringing your phone…',
    'waiting-for-you': 'Answer and press 1',
    'dialling-pub': 'Dialling the pub…',
    'connected': 'Connected',
  };
  const LEG = { idle: '—', queued: 'Starting', initiated: 'Dialling', ringing: 'Ringing', 'in-progress': 'On the call',
    completed: 'Left', busy: 'Busy', 'no-answer': 'No answer', failed: 'Failed', canceled: 'Cancelled' };

  function elapsed(from) {
    const secs = Math.max(0, Math.round((Date.now() - new Date(from).getTime()) / 1000));
    return Math.floor(secs / 60) + ':' + String(secs % 60).padStart(2, '0');
  }

  function sessionView(s) {
    const connected = !!s.conferenceSid;
    const aiOn = s.ai.state !== 'off';
    return [
      h('div', { class: 'hint' }, s.prospect.pubName + ' · ' + s.prospect.phone + ' · ' + elapsed(s.startedAt)),
      h('div', { class: 'stage' }, STAGE[s.stage] || s.stage),
      h('div', { class: 'legs' },
        h('div', { class: 'leg' }, h('div', { class: 'who' }, 'You'), h('div', { class: 'state' }, (LEG[s.agent.state] || s.agent.state) + (s.agent.muted ? ' · muted' : ''))),
        h('div', { class: 'leg' }, h('div', { class: 'who' }, s.prospect.pubName), h('div', { class: 'state' }, LEG[s.pub.state] || s.pub.state)),
        h('div', { class: 'leg' }, h('div', { class: 'who' }, 'Demo receptionist'), h('div', { class: 'state' }, { off: 'Not on the call', joining: 'Joining…', on: 'Talking' }[s.ai.state])),
      ),
      h('div', { class: 'row' },
        aiOn
          ? h('button', { class: 'btn', disabled: state.busy, onclick: () => act(async () => { state.session = await api('DELETE', '/session/demo'); }) }, 'Remove AI')
          : h('button', { class: 'btn primary', disabled: state.busy || s.stage !== 'connected', onclick: () => act(async () => { state.session = await api('POST', '/session/demo'); }) }, 'Bring in demo'),
        h('button', { class: 'btn', disabled: state.busy || !connected, onclick: () => act(async () => { state.session = await api('POST', '/session/mute', { muted: !s.agent.muted }); }) },
          s.agent.muted ? 'Unmute me (take over)' : 'Mute me'),
        state.status?.recordingAllowed
          ? h('button', { class: 'btn', disabled: state.busy || s.recording || s.stage !== 'connected', onclick: () => {
              if (confirm('Have you told them the call is being recorded?')) act(async () => { state.session = await api('POST', '/session/record'); });
            } }, s.recording ? 'Recording' : 'Record (told them)')
          : null,
        h('button', { class: 'btn danger', disabled: state.busy, onclick: () => act(async () => { state.session = await api('POST', '/session/hangup'); }) }, 'Hang up'),
      ),
      s.stage === 'connected' && !aiOn ? h('p', { class: 'hint' }, 'When they agree to hear it, press Bring in demo. You\'ll be muted so the AI can\'t hear you; unmute to take over.') : null,
      h('h3', {}, 'Call log'),
      eventLog(s),
    ];
  }

  function eventLog(s) {
    return h('ol', { class: 'log' }, s.events.slice().reverse().map((e) =>
      h('li', {}, h('time', {}, new Date(e.at).toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit', second: '2-digit' })), h('span', {}, e.text))));
  }

  function outcomeView(s) {
    const st = state.status;
    const answered = !!s.pub.answeredAt;
    const outcome = h('select', { name: 'outcome', required: true },
      h('option', { value: '' }, 'Choose…'), st.outcomes.map((o) => h('option', { value: o }, o)));
    const status = h('select', { name: 'status' }, st.statuses.map((o) => h('option', { value: o }, o)));
    outcome.addEventListener('change', () => {
      const d = st.defaultStatusForOutcome[outcome.value]; if (d) status.value = d;
      status.disabled = outcome.value === 'Asked not to be called';
    });
    if (!answered) { outcome.value = 'No answer'; status.value = 'Callback'; }
    const reaction = h('select', { name: 'demoReaction' }, h('option', { value: '' }, '—'), [1, 2, 3, 4, 5].map((n) => h('option', { value: String(n) }, String(n))));
    const form = h('form', { class: 'grid', onsubmit: (ev) => {
      ev.preventDefault();
      const f = new FormData(form);
      const body = {
        outcome: f.get('outcome'),
        status: status.disabled ? undefined : f.get('status'),
        spokeTo: f.get('spokeTo') || undefined,
        reachedDecisionMaker: f.get('reachedDecisionMaker') === 'on',
        demoReaction: f.get('demoReaction') ? Number(f.get('demoReaction')) : undefined,
        mainObjection: f.get('mainObjection') || undefined,
        nextStep: f.get('nextStep') || undefined,
        followUpDate: f.get('followUpDate') || undefined,
        notes: f.get('notes') || undefined,
      };
      act(async () => {
        const r = await api('POST', '/session/outcome', body);
        state.session = null; await loadQueue();
        return r;
      }, 'Saved to the sheet');
    } },
      h('label', {}, 'Outcome', outcome),
      h('label', {}, 'Prospect status', status),
      h('label', {}, 'Spoke to', h('input', { name: 'spokeTo', placeholder: 'e.g. Dave, landlord' })),
      h('label', {}, 'Follow-up date', h('input', { name: 'followUpDate', type: 'date' })),
      h('label', { class: 'check full' }, h('input', { name: 'reachedDecisionMaker', type: 'checkbox' }), 'Reached the decision maker'),
      s.ai.used ? h('label', {}, 'Demo reaction (1–5)', reaction) : null,
      h('label', { class: s.ai.used ? '' : 'full' }, 'Main objection', h('input', { name: 'mainObjection' })),
      h('label', { class: 'full' }, 'Next step', h('input', { name: 'nextStep', placeholder: 'e.g. Send trial details' })),
      h('label', { class: 'full' }, 'Notes', h('textarea', { name: 'notes' })),
      h('div', { class: 'row full' },
        h('button', { class: 'btn primary', type: 'submit', disabled: state.busy }, 'Save to sheet'),
        h('button', { class: 'btn', type: 'button', disabled: state.busy, onclick: () => {
          if (confirm('Discard this call without logging it?')) act(async () => { await api('DELETE', '/session'); state.session = null; });
        } }, 'Discard'),
      ),
    );
    return [
      h('div', { class: 'hint' }, s.prospect.pubName + ' · ' + s.prospect.phone),
      h('div', { class: 'stage' }, 'Log the call'),
      h('p', { class: 'hint' }, 'Writes a Call Log row and updates the prospect. "Asked not to be called" also adds them to Do Not Call.'),
      form,
      h('h3', {}, 'What happened'),
      eventLog(s),
    ];
  }

  // ── boot ──
  async function boot() {
    $('gate').hidden = true; $('app').hidden = false;
    try {
      await loadStatus();
      await Promise.all([loadQueue(), loadSession()]);
      render();
    } catch (e) { toast(e.message, true); }
  }

  $('gate-form').addEventListener('submit', (ev) => {
    ev.preventDefault();
    key = $('gate-key').value.trim();
    try { sessionStorage.setItem(KEY, key); } catch (_) {}
    boot();
  });
  $('refresh').addEventListener('click', () => act(async () => { await Promise.all([loadStatus(), loadQueue()]); }));
  // Keep the timer and calling-hours chip fresh
  setInterval(() => { if (state.session && state.session.stage !== 'ended') renderMain(); }, 1000);
  setInterval(() => { if (key) loadStatus().then(renderChips).catch(() => {}); }, 60000);

  if (key) boot(); else $('gate').hidden = false;
})();
</script>
</body>
</html>
